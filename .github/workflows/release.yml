name: Release

# On pushes to main, read the project version from the VERSION file (no
# automatic patch bump) and create the tag + GitHub Release only when
# v$VERSION does not exist yet. workflow_dispatch allows a manual retry.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so tag checks see existing tags.
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag and release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            gh release edit "${TAG}" --notes-file CHANGELOG.md
            echo "tag ${TAG} already exists, synced release notes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" --title "${TAG}" --notes-file CHANGELOG.md
          echo "created ${TAG}"
