<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">项目架构</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">apidoc-go 通用 API 文档插件架构</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 使用方 -->
  <rect x="60" y="90" width="780" height="66" rx="10" fill="#eef4ff" stroke="#4a7dff"/>
  <text x="90" y="116" font-size="15" font-weight="600" fill="#1a1a2e">用户代码（使用方）</text>
  <text x="90" y="139" font-size="13" fill="#444">apidoc.New(cfg) · s.Register(Route{ Handler, Doc }) · s.Mount(adapter)</text>

  <!-- 核心 -->
  <rect x="60" y="186" width="780" height="176" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="90" y="212" font-size="15" font-weight="600" fill="#1a1a2e">apidoc 核心（框架无关）</text>
  <rect x="90" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="176" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Store 存储</text>
  <text x="176" y="268" text-anchor="middle" font-size="11" fill="#555">去重 · JSON 序列化</text>
  <rect x="282" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="368" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Model 数据模型</text>
  <text x="368" y="268" text-anchor="middle" font-size="11" fill="#555">App/Version/Action</text>
  <rect x="474" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="560" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Server API</text>
  <text x="560" y="268" text-anchor="middle" font-size="11" fill="#555">menus/detail/export</text>
  <rect x="666" y="228" width="154" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="743" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Auth 鉴权</text>
  <text x="743" y="268" text-anchor="middle" font-size="11" fill="#555">HMAC · 恒时比较</text>
  <rect x="90" y="296" width="220" height="44" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="200" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Parse 注释解析</text>
  <text x="200" y="327" text-anchor="middle" font-size="11" fill="#555">go/ast</text>
  <rect x="340" y="296" width="220" height="44" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="450" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Export 导出</text>
  <text x="450" y="327" text-anchor="middle" font-size="11" fill="#555">JSON / TS</text>
  <rect x="590" y="296" width="220" height="44" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="700" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Mock 数据</text>
  <text x="700" y="327" text-anchor="middle" font-size="11" fill="#555">字段级示例</text>

  <!-- 适配层 -->
  <rect x="60" y="378" width="780" height="112" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="90" y="404" font-size="15" font-weight="600" fill="#1a1a2e">Adapter 适配层（类型化接口）</text>
  <rect x="90" y="420" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="160" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">net/http</text>
  <text x="160" y="460" text-anchor="middle" font-size="11" fill="#555">ServeMux</text>
  <rect x="250" y="420" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="320" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Gin</text>
  <text x="320" y="460" text-anchor="middle" font-size="11" fill="#555">gin.HandlerFunc</text>
  <rect x="410" y="420" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="480" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Echo</text>
  <text x="480" y="460" text-anchor="middle" font-size="11" fill="#555">echo.HandlerFunc</text>
  <rect x="570" y="420" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="640" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Chi</text>
  <text x="640" y="460" text-anchor="middle" font-size="11" fill="#555">http.HandlerFunc</text>
  <rect x="730" y="420" width="90" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="775" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Fiber</text>
  <text x="775" y="460" text-anchor="middle" font-size="11" fill="#555">fiber.Handler</text>

  <!-- 框架层 -->
  <rect x="60" y="520" width="780" height="62" rx="10" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="90" y="546" font-size="15" font-weight="600" fill="#1a1a2e">目标框架</text>
  <text x="90" y="568" font-size="13" fill="#444">net/http · Gin · Echo · Chi · Fiber —— 用户现有项目，无需改造</text>

  <line x1="450" y1="156" x2="450" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="362" x2="450" y2="376" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="490" x2="450" y2="518" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 水印 -->
  <g opacity="0.4">
    <text x="826" y="578" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 578)">https://erik.xyz</text>
  </g>
</svg>
