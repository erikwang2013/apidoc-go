    <rect x="303" y="434" width="100" height="44" rx="22" fill="#eef4ff" stroke="#4a7dff"/>
    <text x="353" y="463" text-anchor="middle" fill="#1a1a2e">Kratos</text>
    <rect x="417" y="434" width="112" height="44" rx="22" fill="#eef4ff" stroke="#4a7dff"/>
    <text x="473" y="463" text-anchor="middle" fill="#1a1a2e">go-zero</text>
  </g>

  <!-- 能力行 -->
  <text x="88" y="516" font-size="20" fill="#64748b">在线调试 · Mock 数据 · JSON/TS 导出 · 注释解析 · ETag 缓存 · 密码鉴权</text>

  <!-- 页脚 -->
  <text x="88" y="582" font-size="18" fill="#94a3b8">github.com/erikwang2013/apidoc-go</text>

