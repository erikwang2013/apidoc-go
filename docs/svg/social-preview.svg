<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif">
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- 右侧柔光背景 -->
  <circle cx="1000" cy="320" r="300" fill="#EEEDFB" opacity=".6"/>

  <!-- 文案 -->
  <text x="88" y="242" font-size="84" font-weight="800" fill="#1a1a2e">apidoc<tspan fill="#4a7dff">-go</tspan></text>
  <text x="88" y="302" font-size="36" font-weight="600" fill="#444">Go 通用 API 文档插件库</text>
  <text x="88" y="352" font-size="22" fill="#666">文档与路由同生 · 类型化 Doc 声明 · 一次接入，全框架通用</text>

