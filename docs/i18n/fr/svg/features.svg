<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Fonctionnalités du projet</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">Aperçu des fonctionnalités principales d'apidoc-go</text>

  <!-- Grille de fonctionnalités 3x3 -->
  <rect x="60" y="100" width="246" height="130" rx="12" fill="#eef4ff" stroke="#4a7dff"/>
  <circle cx="183" cy="138" r="14" fill="#4a7dff"/>
  <text x="183" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="183" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Génération automatique de documentation</text>
  <text x="183" y="200" text-anchor="middle" font-size="12" fill="#555">Déclaration Doc typée, enregistrée avec la route</text>
  <text x="183" y="218" text-anchor="middle" font-size="12" fill="#555">Une déclaration, documentation et route naissent ensemble</text>

  <rect x="327" y="100" width="246" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <circle cx="450" cy="138" r="14" fill="#22c55e"/>
  <text x="450" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Débogage en ligne</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">Appelez les vrais endpoints depuis le navigateur</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#555">Pas de relais serveur, naturellement sans SSRF</text>

  <rect x="594" y="100" width="246" height="130" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <circle cx="717" cy="138" r="14" fill="#f97316"/>
  <text x="717" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="717" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Données Mock</text>
  <text x="717" y="200" text-anchor="middle" font-size="12" fill="#555">Exemples Mock au niveau des champs</text>
  <text x="717" y="218" text-anchor="middle" font-size="12" fill="#555">Une longueur d'avance dans l'intégration des interfaces</text>

  <rect x="60" y="250" width="246" height="130" rx="12" fill="#fdf2f8" stroke="#ec4899"/>
  <circle cx="183" cy="288" r="14" fill="#ec4899"/>
  <text x="183" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="183" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Multi-applications / multi-versions</text>
  <text x="183" y="350" text-anchor="middle" font-size="12" fill="#555">Gestion arborescente App / Version</text>
  <text x="183" y="368" text-anchor="middle" font-size="12" fill="#555">Un seul plugin, toute la documentation du projet</text>

  <rect x="327" y="250" width="246" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="450" cy="288" r="14" fill="#8b5cf6"/>
  <text x="450" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Authentification par mot de passe</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#555">Mot de passe global + mot de passe par application</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#555">Jeton HMAC · comparaison en temps constant</text>

  <rect x="594" y="250" width="246" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
  <circle cx="717" cy="288" r="14" fill="#06b6d4"/>
  <text x="717" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="717" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Documentation Markdown</text>
  <text x="717" y="350" text-anchor="middle" font-size="12" fill="#555">Rendu sécurisé avec goldmark</text>
  <text x="717" y="368" text-anchor="middle" font-size="12" fill="#555">Le HTML natif est automatiquement supprimé</text>

  <rect x="60" y="400" width="246" height="130" rx="12" fill="#fefce8" stroke="#eab308"/>
  <circle cx="183" cy="438" r="14" fill="#eab308"/>
  <text x="183" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="183" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Adaptation multi-frameworks</text>
  <text x="183" y="500" text-anchor="middle" font-size="12" fill="#555">net/http · Gin · Echo · Chi · Fiber</text>
  <text x="183" y="518" text-anchor="middle" font-size="12" fill="#555">Une intégration, compatible avec tous les frameworks</text>

  <rect x="327" y="400" width="246" height="130" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <circle cx="450" cy="438" r="14" fill="#ef4444"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="450" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Export JSON / TypeScript</text>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">Exportez les types d'interface en un clic</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#555">Une intégration frontend-backend plus fluide</text>

  <rect x="594" y="400" width="246" height="130" rx="12" fill="#f0f9ff" stroke="#3b82f6"/>
  <circle cx="717" cy="438" r="14" fill="#3b82f6"/>
  <text x="717" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">9</text>
  <text x="717" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Protection de sécurité</text>
  <text x="717" y="500" text-anchor="middle" font-size="12" fill="#555">Pas de SSRF · restriction par liste blanche CORS</text>
  <text x="717" y="518" text-anchor="middle" font-size="12" fill="#555">Protection XSS · protection anti-traversée de chemin</text>

  <!-- Filigrane -->
  <g opacity="0.4">
    <text x="826" y="536" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 536)">https://erik.xyz</text>
  </g>
</svg>
