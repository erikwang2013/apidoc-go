<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">프로젝트 기능</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">apidoc-go 핵심 기능 개요</text>

  <!-- 3x3 기능 그리드 -->
  <rect x="60" y="100" width="246" height="130" rx="12" fill="#eef4ff" stroke="#4a7dff"/>
  <circle cx="183" cy="138" r="14" fill="#4a7dff"/>
  <text x="183" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="183" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">문서 자동 생성</text>
  <text x="183" y="200" text-anchor="middle" font-size="12" fill="#555">타입화된 Doc 선언, 라우트 등록과 함께</text>
  <text x="183" y="218" text-anchor="middle" font-size="12" fill="#555">한 번의 선언, 문서와 라우트 동시 생성</text>

  <rect x="327" y="100" width="246" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <circle cx="450" cy="138" r="14" fill="#22c55e"/>
  <text x="450" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">온라인 디버깅</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">브라우저에서 실제 API 직접 요청</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#555">서버 전달 없음, SSRF 원천 차단</text>

  <rect x="594" y="100" width="246" height="130" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <circle cx="717" cy="138" r="14" fill="#f97316"/>
  <text x="717" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="717" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Mock 데이터</text>
  <text x="717" y="200" text-anchor="middle" font-size="12" fill="#555">필드 수준 Mock 예시</text>
  <text x="717" y="218" text-anchor="middle" font-size="12" fill="#555">API 연동 한 발 먼저</text>

  <rect x="60" y="250" width="246" height="130" rx="12" fill="#fdf2f8" stroke="#ec4899"/>
  <circle cx="183" cy="288" r="14" fill="#ec4899"/>
  <text x="183" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="183" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">다중 앱 / 다중 버전</text>
  <text x="183" y="350" text-anchor="middle" font-size="12" fill="#555">App / Version 트리 관리</text>
  <text x="183" y="368" text-anchor="middle" font-size="12" fill="#555">플러그인 하나로 전체 프로젝트 문서</text>

  <rect x="327" y="250" width="246" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="450" cy="288" r="14" fill="#8b5cf6"/>
  <text x="450" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">비밀번호 인증</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#555">전역 비밀번호 + 앱 수준 비밀번호</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#555">HMAC 토큰 · 항시 비교</text>

  <rect x="594" y="250" width="246" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
  <circle cx="717" cy="288" r="14" fill="#06b6d4"/>
  <text x="717" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="717" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Markdown 문서</text>
  <text x="717" y="350" text-anchor="middle" font-size="12" fill="#555">goldmark 안전 렌더링</text>
  <text x="717" y="368" text-anchor="middle" font-size="12" fill="#555">네이티브 HTML 자동 제거</text>

  <rect x="60" y="400" width="246" height="130" rx="12" fill="#fefce8" stroke="#eab308"/>
  <circle cx="183" cy="438" r="14" fill="#eab308"/>
  <text x="183" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="183" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">다중 프레임워크 지원</text>
  <text x="183" y="500" text-anchor="middle" font-size="12" fill="#555">net/http · Gin · Echo · Chi · Fiber</text>
  <text x="183" y="518" text-anchor="middle" font-size="12" fill="#555">한 번 연동, 전 프레임워크 공용</text>

  <rect x="327" y="400" width="246" height="130" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <circle cx="450" cy="438" r="14" fill="#ef4444"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="450" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">JSON / TypeScript 내보내기</text>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">API 타입 원클릭 내보내기</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#555">프런트·백엔드 연동 더 원활</text>

  <rect x="594" y="400" width="246" height="130" rx="12" fill="#f0f9ff" stroke="#3b82f6"/>
  <circle cx="717" cy="438" r="14" fill="#3b82f6"/>
  <text x="717" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">9</text>
  <text x="717" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">보안</text>
  <text x="717" y="500" text-anchor="middle" font-size="12" fill="#555">SSRF 없음 · CORS 화이트리스트 제한</text>
  <text x="717" y="518" text-anchor="middle" font-size="12" fill="#555">XSS 방지 · 경로 탐색 방지</text>

  <!-- 水印 -->
  <g opacity="0.4">
    <text x="826" y="536" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 536)">https://erik.xyz</text>
  </g>
</svg>
