<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">প্রজেক্টের বৈশিষ্ট্য</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">apidoc-go মূল বৈশিষ্ট্যগুলির সারসংক্ষেপ</text>

  <!-- 3x3 功能网格 -->
  <rect x="60" y="100" width="246" height="130" rx="12" fill="#eef4ff" stroke="#4a7dff"/>
  <circle cx="183" cy="138" r="14" fill="#4a7dff"/>
  <text x="183" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="183" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">স্বয়ংক্রিয় ডকুমেন্টেশন জেনারেশন</text>
  <text x="183" y="200" text-anchor="middle" font-size="12" fill="#555">টাইপযুক্ত Doc ঘোষণা, রুট রেজিস্ট্রেশনের সাথে</text>
  <text x="183" y="218" text-anchor="middle" font-size="12" fill="#555">এক জায়গায় ঘোষণা, ডকুমেন্টেশন ও রুট একসাথে</text>

  <rect x="327" y="100" width="246" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <circle cx="450" cy="138" r="14" fill="#22c55e"/>
  <text x="450" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">অনলাইন ডিবাগিং</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">ব্রাউজার থেকে সরাসরি বাস্তব ইন্টারফেসে অনুরোধ</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#555">সার্ভার-সাইড ফরওয়ার্ডিং নেই, স্বাভাবিকভাবেই SSRF নেই</text>

  <rect x="594" y="100" width="246" height="130" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <circle cx="717" cy="138" r="14" fill="#f97316"/>
  <text x="717" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="717" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Mock ডেটা</text>
  <text x="717" y="200" text-anchor="middle" font-size="12" fill="#555">ফিল্ড-স্তরের Mock উদাহরণ</text>
  <text x="717" y="218" text-anchor="middle" font-size="12" fill="#555">ইন্টারফেস ইন্টিগ্রেশন দ্রুততর</text>

  <rect x="60" y="250" width="246" height="130" rx="12" fill="#fdf2f8" stroke="#ec4899"/>
  <circle cx="183" cy="288" r="14" fill="#ec4899"/>
  <text x="183" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="183" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">মাল্টি-অ্যাপ / মাল্টি-ভার্সন</text>
  <text x="183" y="350" text-anchor="middle" font-size="12" fill="#555">App / Version ট্রি-ভিত্তিক ম্যানেজমেন্ট</text>
  <text x="183" y="368" text-anchor="middle" font-size="12" fill="#555">একটি প্লাগইন, পুরো প্রজেক্টের ডকুমেন্টেশন</text>

  <rect x="327" y="250" width="246" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="450" cy="288" r="14" fill="#8b5cf6"/>
  <text x="450" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">পাসওয়ার্ড অথেনটিকেশন</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#555">গ্লোবাল পাসওয়ার্ড + অ্যাপ-স্তরের পাসওয়ার্ড</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#555">HMAC Token · কনস্ট্যান্ট-টাইম তুলনা</text>

  <rect x="594" y="250" width="246" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
  <circle cx="717" cy="288" r="14" fill="#06b6d4"/>
  <text x="717" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="717" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Markdown ডকুমেন্টেশন</text>
  <text x="717" y="350" text-anchor="middle" font-size="12" fill="#555">goldmark নিরাপদ রেন্ডারিং</text>
  <text x="717" y="368" text-anchor="middle" font-size="12" fill="#555">নেটিভ HTML স্বয়ংক্রিয়ভাবে অপসারিত</text>

  <rect x="60" y="400" width="246" height="130" rx="12" fill="#fefce8" stroke="#eab308"/>
  <circle cx="183" cy="438" r="14" fill="#eab308"/>
  <text x="183" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="183" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">মাল্টি-ফ্রেমওয়ার্ক অ্যাডাপ্টেশন</text>
  <text x="183" y="500" text-anchor="middle" font-size="12" fill="#555">net/http · Gin · Echo · Chi · Fiber</text>
  <text x="183" y="518" text-anchor="middle" font-size="12" fill="#555">একবার সংযুক্ত, সব ফ্রেমওয়ার্কে কার্যকর</text>

  <rect x="327" y="400" width="246" height="130" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <circle cx="450" cy="438" r="14" fill="#ef4444"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="450" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">JSON / TypeScript এক্সপোর্ট</text>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">ইন্টারফেস টাইপ এক ক্লিকে এক্সপোর্ট</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#555">ফ্রন্ট-ব্যাক ইন্টিগ্রেশন আরও সাবলীল</text>

  <rect x="594" y="400" width="246" height="130" rx="12" fill="#f0f9ff" stroke="#3b82f6"/>
  <circle cx="717" cy="438" r="14" fill="#3b82f6"/>
  <text x="717" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">9</text>
  <text x="717" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">নিরাপত্তা সুরক্ষা</text>
  <text x="717" y="500" text-anchor="middle" font-size="12" fill="#555">SSRF নেই · CORS হোয়াইটলিস্ট সীমাবদ্ধতা</text>
  <text x="717" y="518" text-anchor="middle" font-size="12" fill="#555">XSS প্রতিরোধ · পাথ ট্রাভার্সাল প্রতিরোধ</text>

  <!-- 水印 -->
  <g opacity="0.4">
    <text x="826" y="536" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 536)">https://erik.xyz</text>
  </g>
</svg>
