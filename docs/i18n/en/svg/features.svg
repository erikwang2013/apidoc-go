  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">Request real APIs from the browser</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#555">No server forwarding, SSRF-free</text>

  <rect x="594" y="100" width="246" height="130" rx="12" fill="#fff7ed" stroke="#f97316"/>
