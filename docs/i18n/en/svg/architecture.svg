<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Project Architecture</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">apidoc-go universal API documentation plugin architecture</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Consumers -->
  <rect x="60" y="90" width="780" height="66" rx="10" fill="#eef4ff" stroke="#4a7dff"/>
  <text x="90" y="116" font-size="15" font-weight="600" fill="#1a1a2e">User Code (Consumers)</text>
  <text x="90" y="139" font-size="13" fill="#444">apidoc.New(cfg) · s.Register(Route{ Handler, Doc }) · s.Mount(adapter)</text>

  <!-- Core -->
  <rect x="60" y="186" width="780" height="112" rx="10" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="90" y="212" font-size="15" font-weight="600" fill="#1a1a2e">apidoc Core (Framework-agnostic)</text>
  <rect x="90" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="176" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Store</text>
  <text x="176" y="268" text-anchor="middle" font-size="11" fill="#555">Dedup · JSON serialization</text>
  <rect x="282" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="368" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Model</text>
  <text x="368" y="268" text-anchor="middle" font-size="11" fill="#555">App/Version/Action</text>
  <rect x="474" y="228" width="172" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="560" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Server API</text>
  <text x="560" y="268" text-anchor="middle" font-size="11" fill="#555">menus/detail/login</text>
  <rect x="666" y="228" width="154" height="52" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="743" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Auth</text>
  <text x="743" y="268" text-anchor="middle" font-size="11" fill="#555">HMAC · Constant-time</text>

  <!-- Adapter layer -->
  <rect x="60" y="328" width="780" height="112" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="90" y="354" font-size="15" font-weight="600" fill="#1a1a2e">Adapter Layer (Typed Interfaces)</text>
  <rect x="90" y="370" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="160" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">net/http</text>
  <text x="160" y="410" text-anchor="middle" font-size="11" fill="#555">ServeMux</text>
  <rect x="250" y="370" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="320" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Gin</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#555">gin.HandlerFunc</text>
  <rect x="410" y="370" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="480" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Echo</text>
  <text x="480" y="410" text-anchor="middle" font-size="11" fill="#555">echo.HandlerFunc</text>
  <rect x="570" y="370" width="140" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="640" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Chi</text>
  <text x="640" y="410" text-anchor="middle" font-size="11" fill="#555">http.HandlerFunc</text>
  <rect x="730" y="370" width="90" height="52" rx="8" fill="#ffffff" stroke="#f97316"/>
  <text x="775" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Fiber</text>
  <text x="775" y="410" text-anchor="middle" font-size="11" fill="#555">fiber.Handler</text>

  <!-- Framework layer -->
  <rect x="60" y="470" width="780" height="62" rx="10" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="90" y="496" font-size="15" font-weight="600" fill="#1a1a2e">Target Frameworks</text>
  <text x="90" y="518" font-size="13" fill="#444">net/http · Gin · Echo · Chi · Fiber — your existing project, no changes required</text>

  <line x1="450" y1="156" x2="450" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="298" x2="450" y2="326" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="440" x2="450" y2="468" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Watermark -->
  <g opacity="0.4">
    <text x="826" y="536" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 536)">https://erik.xyz</text>
  </g>
</svg>
