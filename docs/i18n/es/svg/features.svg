<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Funcionalidades del proyecto</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#666">Resumen de las funcionalidades principales de apidoc-go</text>

  <!-- 3x3 功能网格 -->
  <rect x="60" y="100" width="246" height="130" rx="12" fill="#eef4ff" stroke="#4a7dff"/>
  <circle cx="183" cy="138" r="14" fill="#4a7dff"/>
  <text x="183" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="183" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Generación automática de documentación</text>
  <text x="183" y="200" text-anchor="middle" font-size="12" fill="#555">Declaración tipada de Doc al registrar rutas</text>
  <text x="183" y="218" text-anchor="middle" font-size="12" fill="#555">Una declaración, documentación y ruta a la vez</text>

  <rect x="327" y="100" width="246" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e"/>
  <circle cx="450" cy="138" r="14" fill="#22c55e"/>
  <text x="450" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="450" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Depuración en línea</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">Solicita las interfaces reales desde el navegador</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="#555">Sin reenvío por el servidor, naturalmente sin SSRF</text>

  <rect x="594" y="100" width="246" height="130" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <circle cx="717" cy="138" r="14" fill="#f97316"/>
  <text x="717" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="717" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Datos Mock</text>
  <text x="717" y="200" text-anchor="middle" font-size="12" fill="#555">Ejemplos Mock a nivel de campo</text>
  <text x="717" y="218" text-anchor="middle" font-size="12" fill="#555">Adelántate en la integración de interfaces</text>

  <rect x="60" y="250" width="246" height="130" rx="12" fill="#fdf2f8" stroke="#ec4899"/>
  <circle cx="183" cy="288" r="14" fill="#ec4899"/>
  <text x="183" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="183" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Múltiples aplicaciones / versiones</text>
  <text x="183" y="350" text-anchor="middle" font-size="12" fill="#555">Gestión jerárquica de App / Version</text>
  <text x="183" y="368" text-anchor="middle" font-size="12" fill="#555">Un solo plugin para toda la documentación del proyecto</text>

  <rect x="327" y="250" width="246" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/>
  <circle cx="450" cy="288" r="14" fill="#8b5cf6"/>
  <text x="450" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Autenticación por contraseña</text>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#555">Contraseña global + contraseña por aplicación</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#555">Token HMAC · comparación en tiempo constante</text>

  <rect x="594" y="250" width="246" height="130" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
  <circle cx="717" cy="288" r="14" fill="#06b6d4"/>
  <text x="717" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="717" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Documentos Markdown</text>
  <text x="717" y="350" text-anchor="middle" font-size="12" fill="#555">Renderizado seguro con goldmark</text>
  <text x="717" y="368" text-anchor="middle" font-size="12" fill="#555">El HTML nativo se elimina automáticamente</text>

  <rect x="60" y="400" width="246" height="130" rx="12" fill="#fefce8" stroke="#eab308"/>
  <circle cx="183" cy="438" r="14" fill="#eab308"/>
  <text x="183" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="183" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Adaptación a múltiples frameworks</text>
  <text x="183" y="500" text-anchor="middle" font-size="12" fill="#555">net/http · Gin · Echo · Chi · Fiber</text>
  <text x="183" y="518" text-anchor="middle" font-size="12" fill="#555">Una sola integración, válido en todos los frameworks</text>

  <rect x="327" y="400" width="246" height="130" rx="12" fill="#fef2f2" stroke="#ef4444"/>
  <circle cx="450" cy="438" r="14" fill="#ef4444"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="450" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Exportación JSON / TypeScript</text>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">Exporta los tipos de las interfaces con un clic</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="#555">Integración frontend-backend más fluida</text>

  <rect x="594" y="400" width="246" height="130" rx="12" fill="#f0f9ff" stroke="#3b82f6"/>
  <circle cx="717" cy="438" r="14" fill="#3b82f6"/>
  <text x="717" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">9</text>
  <text x="717" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a2e">Protección de seguridad</text>
  <text x="717" y="500" text-anchor="middle" font-size="12" fill="#555">Sin SSRF · CORS restringido por lista blanca</text>
  <text x="717" y="518" text-anchor="middle" font-size="12" fill="#555">Anti-XSS · protección contra path traversal</text>

  <!-- 水印 -->
  <g opacity="0.4">
    <text x="826" y="536" font-size="15" fill="#94a3b8" text-anchor="end" transform="rotate(-18 826 536)">https://erik.xyz</text>
  </g>
</svg>
