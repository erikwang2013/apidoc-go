<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Docs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#24292f;height:100vh;display:flex}
#login{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10}
#login .box{background:#fff;padding:24px;border-radius:8px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#login h2{margin-bottom:12px}
#app{display:flex;flex:1;min-width:0}
aside{width:300px;min-width:300px;border-right:1px solid #d0d7de;overflow:auto;background:#f6f8fa}
aside h1{font-size:15px;padding:12px 14px;border-bottom:1px solid #d0d7de}
aside ul{list-style:none}
aside .app{padding:10px 12px;font-weight:600;background:#eaeef2}
aside li.act{padding:4px 12px 4px 28px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside li.act:hover{background:#eaeef2}
aside li.act.sel{background:#ddf4ff;color:#0969da}
main{flex:1;overflow:auto;padding:20px 28px}
.tabs{margin-bottom:14px}
.tabs button{border:1px solid #d0d7de;background:#f6f8fa;padding:6px 16px;cursor:pointer;border-radius:6px;margin-right:6px}
.tabs button.on{background:#0969da;color:#fff;border-color:#0969da}
h2.title{margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:700;color:#fff;font-size:12px;margin-right:8px;vertical-align:2px}
.get{background:#1a7f37}.post{background:#8250df}.put{background:#9a6700}
.patch{background:#bf3989}.delete{background:#cf222e}
.meta{color:#57606a;margin-bottom:12px}
table{border-collapse:collapse;width:100%;margin:8px 0 16px}
th,td{border:1px solid #d0d7de;padding:6px 10px;text-align:left;font-size:13px}
th{background:#f6f8fa}
.req{color:#cf222e;font-weight:600}
pre{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:10px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace}
.md{margin:12px 0}
.md h1,.md h2,.md h3{margin:10px 0 6px}
.md p{margin:6px 0}
.md code{background:#f6f8fa;padding:1px 4px;border-radius:3px;font-size:12px}
.md pre{background:#f6f8fa}
#debug input[type=text],#debug select{padding:5px 8px;border:1px solid #d0d7de;border-radius:5px}
#debug .row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
#debug .row input{flex:1}
button.send{background:#1f883d;color:#fff;border:none;padding:7px 20px;border-radius:6px;cursor:pointer}
#result{margin-top:12px}
.hidden{display:none}
input[type=text],input[type=password]{padding:6px 8px;border:1px solid #d0d7de;border-radius:5px;width:100%}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2>Login</h2>
    <input id="pw" type="password" placeholder="Password">
    <p id="login-err" style="color:#cf222e;min-height:20px;margin-top:6px"></p>
    <button class="send" onclick="doLogin()" style="width:100%">Sign in</button>
  </div>
</div>
<div id="app">
  <aside>
    <h1 id="proj"></h1>
    <ul id="tree"></ul>
  </aside>
  <main>
    <div class="tabs">
      <button id="tab-info" class="on" onclick="showTab('info')">Info</button>
      <button id="tab-debug" onclick="showTab('debug')">Debug</button>
    </div>
    <section id="info">
      <h2 class="title"><span class="badge" id="d-method"></span><span id="d-title"></span></h2>
      <div class="meta"><span id="d-url"></span><span id="d-author"></span></div>
      <p id="d-desc"></p>
      <h3>Params</h3><table id="d-params"></table>
      <h3>Responses</h3><div id="d-responses"></div>
      <div class="md" id="d-markdown"></div>
      <h3>Mock</h3><pre id="d-mock"></pre>
    </section>
    <section id="debug" class="hidden">
      <div class="row">
        <select id="dg-method">
          <option>GET</option><option>POST</option><option>PUT</option>
          <option>PATCH</option><option>DELETE</option>
        </select>
        <input type="text" id="dg-url" placeholder="/api/users">
      </div>
      <div id="dg-params"></div>
      <button class="send" onclick="sendDebug()">Send</button>
      <div id="result"><div id="res-status" class="meta"></div><pre id="res-body"></pre></div>
    </section>
  </main>
</div>
<script>
const appTokens = {}; // app key -> scoped token
let current = null;   // detail response
const base = location.pathname.replace(/\/+$/, ''); // mount prefix, e.g. "/apidoc" or ""

async function api(path, opts) {
  opts = opts || {};
  opts.credentials = 'include';
  if (opts.headers === undefined) opts.headers = {};
  opts.headers['Content-Type'] = 'application/json';
  const res = await fetch(base + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { res, data };
}

async function loadMenus() {
  const { res, data } = await api('/api/menus');
  if (res.status === 401) { document.getElementById('login').style.display = 'flex'; return; }
  renderTree(data.data);
}

function renderTree(apps) {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  for (const app of apps) {
    const ah = document.createElement('div');
    ah.className = 'app';
    ah.textContent = app.title + ' (' + app.key + ')';
    tree.appendChild(ah);
    for (const v of app.versions) {
      for (const c of v.controllers) {
        for (const a of c.actions) {
          const li = document.createElement('li');
          li.className = 'act';
          li.textContent = a.title || a.id;
          li.dataset.id = a.id;
          li.onclick = () => openAction(a.id, li);
          tree.appendChild(li);
        }
      }
    }
  }
}

async function openAction(id, li) {
  document.querySelectorAll('li.act').forEach(x => x.classList.remove('sel'));
  if (li) li.classList.add('sel');
  const path = '/api/detail?id=' + encodeURIComponent(id);
  let { res, data } = await api(path);
  if (res.status === 401 && data && data.msg === 'app token required') {
    const pw = prompt('App "' + data.app + '" is password protected. Enter app password:');
    if (!pw) return;
    await appLogin(data.app, pw);
    const d2 = await fetchDetailWithToken(path, data.app);
    if (d2) return showDetail(d2, data.app);
  }
  if (res.status === 401) { document.getElementById('login').style.display = 'flex'; return; }
  showDetail(data.data, null);
}

async function fetchDetailWithToken(path, appKey) {
  const res = await fetch(base + path, { credentials: 'include', headers: { 'X-Apidoc-App-Token': appTokens[appKey] || '' } });
  const data = await res.json();
  return res.status === 200 ? data.data : null;
}

async function appLogin(appKey, password) {
  const { res, data } = await api('/api/app-login', {
    method: 'POST', body: JSON.stringify({ app: appKey, password })
  });
  if (res.status === 200 && data.data && data.data.token) appTokens[appKey] = data.data.token;
}

function showDetail(d, appKey) {
  current = d;
  document.getElementById('d-title').textContent = d.title || d.url;
  document.getElementById('d-method').textContent = d.method;
  document.getElementById('d-method').className = 'badge ' + d.method.toLowerCase();
  document.getElementById('d-url').textContent = d.url;
  document.getElementById('d-author').textContent = d.author ? 'by ' + d.author : '';
  document.getElementById('d-desc').textContent = d.desc || '';
  renderParams(d.params);
  renderResponses(d.responses);
  document.getElementById('d-markdown').innerHTML = d.markdown_html || '';
  document.getElementById('d-mock').textContent = d.mock || '{}';
  setupDebug(d, appKey);
  showTab('info');
}

function renderParams(params) {
  const t = document.getElementById('d-params');
  t.innerHTML = '<tr><th>Name</th><th>In</th><th>Type</th><th>Required</th><th>Default</th><th>Description</th></tr>';
  for (const p of params) row(t, p, 0);
  function row(t, p, depth) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + '&nbsp;'.repeat(depth * 4) + esc(p.name) + '</td><td>' + esc(p.in) +
      '</td><td>' + esc(p.type) + '</td><td>' + (p.required ? '<span class="req">yes</span>' : '') +
      '</td><td>' + esc(p.default || p.mock || '') + '</td><td>' + esc(p.desc) + '</td>';
    t.appendChild(tr);
    for (const c of p.children || []) row(t, c, depth + 1);
  }
}

function renderResponses(responses) {
  const d = document.getElementById('d-responses');
  d.innerHTML = '';
  for (const r of responses) {
    const pre = document.createElement('pre');
    pre.textContent = (r.name ? r.name + ': ' : '') + (r.type || '') + (r.desc ? ' — ' + r.desc : '');
    d.appendChild(pre);
    if (r.mock) { const m = document.createElement('pre'); m.textContent = r.mock; d.appendChild(m); }
    if (r.fields && r.fields.length) {
      const t = document.createElement('table');
      t.innerHTML = '<tr><th>Field</th><th>Type</th><th>Description</th></tr>';
      addFields(t, r.fields, 0);
      d.appendChild(t);
    }
  }
  function addFields(t, fields, depth) {
    for (const f of fields) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + '&nbsp;'.repeat(depth * 4) + esc(f.name) + '</td><td>' + esc(f.type) +
        '</td><td>' + esc(f.desc) + '</td>';
      t.appendChild(tr);
      addFields(t, f.children || [], depth + 1);
    }
  }
}

function setupDebug(d) {
  document.getElementById('dg-method').value = d.method;
  document.getElementById('dg-url').value = d.url;
  const box = document.getElementById('dg-params');
  box.innerHTML = '';
  for (const p of d.params) {
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('span');
    lab.textContent = '[' + p.in + '] ' + p.name;
    lab.style.minWidth = '140px';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.dataset.in = p.in;
    inp.dataset.name = p.name;
    inp.placeholder = p.desc || '';
    inp.value = p.mock || p.default || '';
    row.appendChild(lab);
    row.appendChild(inp);
    box.appendChild(row);
  }
}

async function sendDebug() {
  let url = document.getElementById('dg-url').value;
  const method = document.getElementById('dg-method').value;
  const query = [], headers = {}, body = {};
  document.querySelectorAll('#dg-params input').forEach(inp => {
    const v = inp.value.trim();
    if (!v) return;
    if (inp.dataset.in === 'query') query.push(encodeURIComponent(inp.dataset.name) + '=' + encodeURIComponent(v));
    else if (inp.dataset.in === 'header') headers[inp.dataset.name] = v;
    else if (inp.dataset.in === 'path') url = url.replace('{' + inp.dataset.name + '}', encodeURIComponent(v));
    else body[inp.dataset.name] = v;
  });
  if (query.length) url += (url.includes('?') ? '&' : '?') + query.join('&');
  const opts = { method, credentials: 'include', headers };
  if (method !== 'GET' && Object.keys(body).length) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  try {
    const res = await fetch(url, opts);
    document.getElementById('res-status').textContent = res.status + ' ' + res.statusText;
    document.getElementById('res-body').textContent = (await res.text()) || '';
  } catch (e) {
    document.getElementById('res-status').textContent = 'request failed';
    document.getElementById('res-body').textContent = String(e);
  }
}

function showTab(name) {
  document.getElementById('tab-info').classList.toggle('on', name === 'info');
  document.getElementById('tab-debug').classList.toggle('on', name === 'debug');
  document.getElementById('info').classList.toggle('hidden', name !== 'info');
  document.getElementById('debug').classList.toggle('hidden', name !== 'debug');
}

async function doLogin() {
  const pw = document.getElementById('pw').value;
  const { res, data } = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: pw }) });
  if (res.status === 200) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('pw').value = '';
    loadMenus();
  } else {
    document.getElementById('login-err').textContent = (data && data.msg) || 'login failed';
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadMenus();
</script>
</body>
</html>
